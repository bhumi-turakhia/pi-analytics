<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Outfit:wght@700&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
      
      .pi-glyph {
        font-family: 'Times New Roman', 'Cambria Math', 'Cambria', 'Georgia', 'Playfair Display', 'Lora', 'Nimbus Roman', serif;
        font-style: italic;
        font-weight: 700;
        fill: #19529b;
      }
      
      .by-script {
        font-family: 'Dancing Script', 'Brush Script MT', 'Caveat', 'Segoe Script', cursive;
        font-style: italic;
        font-weight: 700;
        fill: #f5a623;
      }
      
      .num-three {
        font-family: 'Outfit', 'Arial Rounded MT Bold', 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 700;
        fill: #ffffff;
      }
      
      .tm-mark {
        font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #19529b;
      }
      
      .tagline-text {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, system-ui, sans-serif;
        font-weight: 700;
        font-size: 14.5px;
        letter-spacing: 0.15px;
        fill: #19529b;
      }
    </style>
  </defs>

  <!-- Main Brand Row -->
  <g transform="translate(14, 8)">
    <!-- Exact Greek Small Letter Pi in classic serif italic font -->
    <text x="36" y="68" font-size="78" text-anchor="middle" class="pi-glyph">π</text>

    <!-- Handwritten script 'by' in golden yellow -->
    <text x="96" y="68" font-size="44" class="by-script">by</text>

    <!-- Sky Blue Rounded Rectangle Badge -->
    <g transform="translate(154, 12)">
      <rect x="0" y="0" width="60" height="60" rx="14" fill="#249cdb" />
      <!-- Bold White '3' -->
      <text x="30" y="46" font-size="44" text-anchor="middle" class="num-three">3</text>
    </g>

    <!-- Trademark TM -->
    <text x="218" y="19" class="tm-mark">TM</text>
  </g>

  <!-- Tagline: Transforming Enterprises for Future -->
  <text x="160" y="106" text-anchor="middle" class="tagline-text">Transforming Enterprises for Future</text>
</svg>
